<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="profile-card">

            <img src="download.jpg" alt="Student Profile" class="profile-img">

            <h2>Saravanan</h2>

            <p class="department">B.Sc Computer Science</p>

            <h3>Skills</h3>

            <div class="skills">
                <span>HTML</span>
                <span>CSS</span>
                <span>JavaScript</span>
                <span>Python</span>
            </div>

            <button>Contact Me</button>

        </div>

    </div>

</body>
</html>
