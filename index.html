<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards</title>
    <link rel="stylesheet" href="task.css">
</head>
<body>

    <h1>Our Products</h1>

    <div class="product-container">

        <div class="card">
            <img src="download.avif" alt="Smart Watch">
            <h2>Smart Watch</h2>
            <p>Smart digital watch with modern features.</p>
            <h3>$1,999</h3>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="41m81cYUgpL._AC_UF1000,1000_QL80_.jpg" alt="Headphones">
            <h2>Headphones</h2>
            <p>Wireless headphones with clear sound.</p>
            <h3>$1,499</h3>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="download (1).jpg" alt="Mobile Phone">
            <h2>Mobile Phone</h2>
            <p>Powerful smartphone with a great display.</p>
            <h3>$14,999</h3>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="download (2).jpg" alt="Laptop">
            <h2>Laptop</h2>
            <p>Fast and reliable laptop for daily work.</p>
            <h3>$45,999</h3>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
